[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aas-submodel-validate"
version = "0.1.1"
description = "Offline conformance validator for AAS submodel templates, starting with IDTA 02004 Handover Documentation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Wooyong Lee", email = "zero8004paz@gmail.com" }]
keywords = ["aas", "asset-administration-shell", "submodel", "idta", "industry-4.0", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
# One dependency, pure Python, no C extensions: this tool is for networks
# where `pip` may not exist and every wheel crosses an air gap by hand.
dependencies = ["aas-core3.0>=1.1.4,<2"]

# The index page renders these as the only navigation it has. With two
# entries a reader who wanted the changelog, the schema or somewhere to
# report a defect had nowhere to click: the README's own links are
# relative, and a package description is not inside the repository they
# resolve against.
[project.urls]
Homepage = "https://github.com/dev365code/aas-submodel-validate"
Documentation = "https://github.com/dev365code/aas-submodel-validate#readme"
Changelog = "https://github.com/dev365code/aas-submodel-validate/blob/main/CHANGELOG.md"
Issues = "https://github.com/dev365code/aas-submodel-validate/issues"
"Report schema" = "https://github.com/dev365code/aas-submodel-validate/blob/main/docs/report-schema.md"
"Sibling (iiRDS)" = "https://github.com/dev365code/iirds-validate"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.16.3"]

[project.scripts]
aas-submodel-validate = "aas_submodel_validate.cli:main"
smtv = "aas_submodel_validate.cli:main"

# NOTICE points at THIRD_PARTY.md for the pinned upstream revision and
# the hashes, and THIRD_PARTY.md was not in the wheel -- so inside a
# wheel the attribution a CC BY 4.0 redistribution carries referred to a
# file that was not there. Named here so the three travel together.
#
# setuptools' own key rather than PEP 639's `[project] license-files`.
# The reason written here was that PEP 639 means emitting
# Metadata-Version 2.4 and the machines this project is for run an old
# pip -- and this build already emits 2.4, so half of that argument was
# answering a question nobody asked. What is left is the classifier:
# PEP 639 wants it dropped, and a classifier is what several installers
# and index mirrors still read a licence from.
[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]

[tool.setuptools.packages.find]
where = ["src"]

# The vendored IDTA template (CC BY 4.0) travels in the wheel: the offline
# story is that what you install carries its own provenance. NOTICE says the
# distribution contains it, so it must.
#
# So does IDTA's own published example, under the same licence and the same
# NOTICE entry. `pip install` used to leave a reader with a validator and
# nothing to validate: the first command the front page gave named a file
# only a clone had, and on a machine where the clone is blocked -- which is
# the machine this project is for -- there was no first verdict at all.
# `smtv --example` runs it, and needs no network and no repository.
[tool.setuptools.package-data]
aas_submodel_validate = ["data/smt/**/*.json", "data/smt/**/*.txt",
                         "data/example/*.aasx",
                         "data/example/*.txt"]

[tool.ruff]
# data/battery-passport is a bundle copied verbatim from its own build
# tree; it is generated, not authored, and hand edits here are
# forbidden, so this repo's lint has no standing over it. Its scripts still parse
# and import -- tools/battery_data_check.py holds that.
extend-exclude = ["data"]
line-length = 100
target-version = "py39"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "UP006", "UP007", "UP035", "UP045",  # py39 target: keep typing.List / Optional
    "UP031",                    # %-formatting matches the sibling repos' voice
    "B905",                     # zip(strict=) is 3.10+
    "E501",                     # line length is the formatter's business
]
