<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" role="img" aria-label="Real smtv output on a battery passport: one warning, BAT-R8, conformant to the template and not to the regulation, with the element named, the clause cited and a remedy">
<rect x="1" y="1" width="938" height="318" rx="10" fill="#12161a" stroke="#252b30" stroke-width="1.5"/>
<circle cx="24" cy="19" r="5" fill="#e0604d"/><circle cx="42" cy="19" r="5" fill="#e8c268"/><circle cx="60" cy="19" r="5" fill="#5cb87f"/>
<text x="80" y="23" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7d8a99">smtv — real output, colour added</text>
<text y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#8fd0a8" font-weight="700">$ </tspan><tspan x="46" fill="#d8dfe5">pip install aas-submodel-validate</tspan></text><text y="61" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#8fd0a8" font-weight="700">$ </tspan><tspan x="46" fill="#d8dfe5">smtv --allow-unmatched --meta info battery-passport.json</tspan></text><text y="91" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#e8c268" font-weight="700">warning </tspan><tspan x="100" fill="#e8c268" font-weight="700">BAT-R8</tspan><tspan x="168" fill="#d8dfe5">conformant to the template and not to the regulation:</tspan></text><text y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="168" fill="#d8dfe5">'EnergyRoundTripEfficiencyFade' is absent</tspan></text><text y="129" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="140" fill="#93a1ad" font-weight="700">at</tspan><tspan x="168" fill="#7d8a99">TechnicalData/EnergyRoundTripEfficiencyFade</tspan></text><text y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="140" fill="#93a1ad" font-weight="700">saw</tspan><tspan x="168" fill="#7d8a99">IDTA 02035-4 V1.0.1 makes it ZeroToOne;</tspan></text><text y="163" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="168" fill="#7d8a99">Annex IV Part A (4) requires it</tspan></text><text y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="140" fill="#93a1ad" font-weight="700">per</tspan><tspan x="168" fill="#7d8a99">Regulation (EU) 2023/1542 Annex VII</tspan></text><text y="197" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="140" fill="#93a1ad" font-weight="700">fix</tspan><tspan x="168" fill="#5cb87f">Provide the element, or record that this battery is</tspan></text><text y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="168" fill="#5cb87f">outside the provision that requires it.</tspan></text><text y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="140" fill="#93a1ad" font-weight="700">note</tspan><tspan x="180" fill="#93a1ad">8 more are known to disagree and are not reported,</tspan></text><text y="259" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="180" fill="#93a1ad">because whether the law requires them depends on a category</tspan></text><text y="283" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#d8dfe5" font-weight="700">0 error(s), 1 warning(s), 3 info</tspan><tspan x="280" fill="#93a1ad">battery-passport.json · judged 0 of 1 submodel</tspan></text>
</svg>