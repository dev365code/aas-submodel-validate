<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 411" role="img" aria-label="Real smtv output on an LMT battery passport: one warning, BAT-R8, the template permitting an element absent that a published reading of the regulation expects for LMT batteries, with the element named, the clause cited and a remedy">
<rect x="1" y="1" width="938" height="409" rx="10" fill="#12161a" stroke="#252b30" stroke-width="1.5"/>
<circle cx="24" cy="19" r="5" fill="#e0604d"/><circle cx="42" cy="19" r="5" fill="#e8c268"/><circle cx="60" cy="19" r="5" fill="#5cb87f"/>
<text x="80" y="23" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7d8a99">smtv — real output, colour added</text>
<text y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#8fd0a8" font-weight="700">$ </tspan><tspan x="46" fill="#d8dfe5">pip3 install aas-submodel-validate</tspan></text><text y="61" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#8fd0a8" font-weight="700">$ </tspan><tspan x="46" fill="#d8dfe5">smtv --meta info battery-passport.json</tspan></text><text y="91" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#e8c268" font-weight="700">warning </tspan><tspan x="100" fill="#e8c268" font-weight="700">BAT-R8</tspan><tspan x="168" fill="#d8dfe5">conformant to the template; a published reading of the</tspan></text><text y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="168" fill="#d8dfe5">regulation expects it for LMT batteries:</tspan></text><text y="129" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="168" fill="#d8dfe5">'RemainingCapacity' is absent</tspan></text><text y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="140" fill="#93a1ad" font-weight="700">at</tspan><tspan x="168" fill="#7d8a99">RemainingCapacity</tspan></text><text y="165" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="140" fill="#93a1ad" font-weight="700">saw</tspan><tspan x="168" fill="#7d8a99">IDTA 02035-5 V1.0.2 makes it ZeroToOne.</tspan></text><text y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="168" fill="#7d8a99">Read as expected for LMT by: European Commission guidance,…</tspan></text><text y="199" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="140" fill="#93a1ad" font-weight="700">per</tspan><tspan x="168" fill="#7d8a99">Regulation (EU) 2023/1542 Annex VII Part A (1);</tspan></text><text y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="168" fill="#7d8a99">docs/divergences.md #37 for whose reading of it this answers</tspan></text><text y="233" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="140" fill="#93a1ad" font-weight="700">fix:</tspan><tspan x="168" fill="#5cb87f">Provide the element, or record that this battery is</tspan></text><text y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="168" fill="#5cb87f">outside the provision read as requiring it.…</tspan></text><text y="276" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="140" fill="#7d8a99">…</tspan></text><text y="293" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="140" fill="#93a1ad" font-weight="700">note</tspan><tspan x="180" fill="#93a1ad">BAT-R8 reported 7 of the 9 elements this table holds;</tspan></text><text y="312" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="180" fill="#93a1ad">this file declares battery category 'lmt'…</tspan></text><text y="336" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="140" fill="#93a1ad" font-weight="700">key</tspan><tspan x="180" fill="#93a1ad">at=where saw=what is there now per=the clause fix=what to change</tspan></text><text y="355" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="140" fill="#93a1ad" font-weight="700">key</tspan><tspan x="180" fill="#93a1ad">note=something this run did, not a defect -- nothing to change</tspan></text><text y="374" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#d8dfe5" font-weight="700">ok -- 0 error(s), 1 warning(s), 8 info</tspan><tspan x="327" fill="#93a1ad">-- battery-passport.json; judged 3 of 3 submodels</tspan></text>
</svg>