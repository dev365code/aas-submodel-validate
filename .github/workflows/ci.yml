name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.3
      - run: ruff check .
      - run: pip install -e .
      - name: the generated rule table matches its generator
        run: python tools/extract_smt_rules.py --check
      - name: the vendored official material matches its recorded hashes
        run: python tools/vendor_template.py --check
      - name: readers the battery-passport extractors import
        run: pip install openpyxl pymupdf
      - name: the battery-passport indexes agree with themselves
        run: python tools/battery_data_check.py
      - name: the battery rule table matches its generator
        run: python tools/extract_battery_rules.py --check
      - name: the front door's pictures match their generator
        # A terminal shot is the one asset that can go quietly false --
        # the tool changes a sentence and the picture keeps the old one.
        # `tests/test_door.py` asks the harder question, whether the tool
        # still says what the picture shows; this one only asks whether
        # the committed bytes are the ones the generator writes.
        run: python tools/gen_door.py --check

  test:
    name: py${{ matrix.python }} ${{ matrix.label }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          # aas-core3.0's own CI matrix stops at 3.12, so this row is the
          # floor dependency's first verdict on 3.13 -- a failure here is
          # information, not noise.
          - { os: ubuntu-latest, python: "3.13" }
          # pyproject declares aas-core3.0>=1.1.4, so 1.1.4 exactly is what
          # this row runs: a floor test that floats stops testing the floor.
          - { os: ubuntu-latest, python: "3.11", pin: "aas-core3.0==1.1.4", label: "floor" }
          # Windows is where an unclosed ZIP handle keeps files locked, and
          # where a checkout could hand the suite different bytes than the
          # ones whose hashes were recorded.
          - { os: windows-latest, python: "3.11" }
          # The front page says Linux, macOS and Windows. Two of those
          # were measured. Nothing here is compiled, so the claim was
          # very probably true -- but "very probably" is the standard
          # this project refuses everywhere else, and macOS is where a
          # case-insensitive filesystem answers a path question
          # differently from the machine the archive was built on.
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - if: matrix.pin
        run: pip install "${{ matrix.pin }}"
      - run: pytest -q
      - name: every rule id fired somewhere
        run: python tools/rule_coverage.py --check
      # Also in the lint job, deliberately: this one runs on every OS in
      # the matrix, and end-of-line damage is a property of the checkout,
      # not of the commit. A hash verified only where the file was written
      # verifies nothing about the machine that unpacks it.
      - name: the vendored bytes survived this checkout
        run: python tools/vendor_template.py --check

  wheel:
    # The failure this exists for: a wheel that installs but is missing the
    # vendored template, so the tool works from a checkout and its NOTICE
    # lies about what it ships. Nothing in the test suite (editable install)
    # would notice.
    name: installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel --outdir dist/

      - name: the suite runs from an unpacked sdist, as MANIFEST.in promises
        # `MANIFEST.in` opens by saying a downstream packager who
        # unpacks the sdist and runs pytest must find a runnable suite,
        # and nothing measured it: the suite runs here from a checkout,
        # where files an sdist does not carry are present. That promise
        # has broken more than once -- a test that shelled out to git,
        # a test that read `.gitignore` -- and each time it was found by
        # hand rather than here. Nothing installed: the
        # unpacked tree is put on the path exactly as a packager would
        # find it.
        run: |
          python -m build --sdist --outdir dist/
          # What a packager has: the runtime dependency and a test
          # runner, and not this package -- the unpacked tree is what
          # the suite must run against. Taken from the wheel just built
          # rather than written here, so the two cannot drift; without
          # them the step died on `No module named pytest`, and then on
          # `aas_core3`, from the first push it was on. Written to a
          # temporary file rather than the workspace: the first version
          # left an untracked one behind, which is one `git add -A` away
          # from a commit for anybody running this step by hand.
          requirements="$(mktemp)"
          python - <<'PY' > "$requirements"
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          meta = [n for n in names if n.endswith(".dist-info/METADATA")][0]
          text = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).read(meta).decode()
          for line in text.replace("\r\n", "\n").split("\n\n", 1)[0].splitlines():
              if line.startswith("Requires-Dist:") and "extra ==" not in line:
                  print(line.split(":", 1)[1].strip())
          PY
          cat "$requirements"
          pip install pytest -r "$requirements"
          # Outside the workspace, so the steps after this see the
          # directory they expect and nothing has to be deleted
          # afterwards. The first version cleaned up with
          # `rm -rf "$GITHUB_WORKSPACE/unpacked"`, which is `rm -rf
          # /unpacked` anywhere that variable is unset -- including a
          # maintainer running the step by hand.
          unpacked="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$unpacked"
          cd "$unpacked"/*/
          PYTHONPATH="$PWD/src:$PWD/tests" python -m pytest -q

      - name: the wheel must carry the vendored template and not the corpus
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          required = [
              "aas_submodel_validate/data/smt/02004/2.0.1/template.json",
              "aas_submodel_validate/data/smt/02004/2.0.1/sha256sums.txt",
              "aas_submodel_validate/data/smt/02003/2.0.1/template.json",
              "aas_submodel_validate/data/smt/02003/2.0.1/sha256sums.txt",
              "aas_submodel_validate/data/smt/02035-2/1.0/template.json",
              "aas_submodel_validate/data/smt/02035-2/1.0/sha256sums.txt",
              # `pip install` has to leave the reader something to judge.
              "aas_submodel_validate/data/example/idta-02004-2.0.aasx",
              "aas_submodel_validate/data/example/sha256sums.txt",
          ]
          missing = [n for n in required if n not in names]
          if missing:
              sys.exit("missing from the wheel: %s" % missing)
          strays = sorted(n for n in names if "corpus" in n or n.startswith("tests/"))
          if strays:
              sys.exit("the wheel carries test material it should not: %s" % strays[:5])
          print("wheel carries the template, and no corpus")
          PY
      - name: no distribution carries what it must not
        # The same check the release runs. Here on every push, because a
        # release line first exercised on the day of the release is one
        # that dies on the day of the release.
        run: python tools/check_distributions.py
      - name: the single file builds twice to the same bytes and answers
        run: |
          python tools/build_zipapp.py -o dist/smtv.pyz --check
          python tools/build_zipapp.py -o /tmp/again.pyz
          cmp dist/smtv.pyz /tmp/again.pyz
      - name: install into a clean environment and smoke-test
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          /tmp/v/bin/smtv --version
          /tmp/v/bin/aas-submodel-validate --rules > /dev/null
