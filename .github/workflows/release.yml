# Runs when a version tag is pushed. Proves the tree green, builds the
# wheel, the sdist and the single file, proves the single file
# reproducible by building it twice, attaches everything to a GitHub
# Release with the checksums beside it -- for the air-gapped audience,
# "the hash on the release page is the hash of the file I carried in" is
# the entire trust story -- and then publishes the same bytes to PyPI.
#
# The publish job is last on purpose and touches nothing above it. When
# pypi.org did not yet trust this repository it failed there, visibly,
# with the GitHub Release already made -- which is the ordering to keep
# even now that it does trust it, because the next thing that can refuse
# an upload is the metadata, not the identity. This comment described the
# trust as pending; 0.1.1 published from here on 2026-09-05.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Reading what CI concluded about this commit. `contents: read` at
      # the top of the file does not carry it, and without it the gate
      # below meets a 403 -- which it treats as "no verdict" and refuses,
      # correctly but unhelpfully, on every release.
      actions: read
      # Signing. Without it the only trust story is a checksum file that
      # travels beside the files it vouches for and is replaceable by
      # whoever could replace them -- an integrity proof read as an
      # authenticity one. A site whose rule is "nothing unsigned comes
      # in" stops there, and `shasum -c` printing OK is exactly what
      # makes that stop look unnecessary to everyone else.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: CI has judged this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag is the only thing between a commit and PyPI, and until
        # now the only question asked of that commit was whether
        # `make check` passes here -- one Python on one Linux. CI asks
        # ten rows, and the gap is not decorative: a change green
        # locally and green on every ubuntu row broke `windows-latest`
        # alone, and a tag pushed at that commit would have found this
        # job green and published it.
        #
        # `--commit` and `--workflow` are both load-bearing. Without the
        # first this asks what CI concluded most recently, which minutes
        # after a green main is almost always success -- the gate
        # measuring the repository instead of the commit. Without the
        # second, any workflow's success counts, including this one.
        #
        # Absence is a refusal, not a pass: no completed run leaves
        # `verdict` empty and the test exits 1. So a tag pushed while CI
        # is still running stops here. That is the intended answer --
        # re-run this job once CI is green rather than widening the
        # gate, because "it was probably fine" is the belief this step
        # exists to stop being load-bearing.
        run: |
          sha="$(git rev-parse HEAD)"
          verdict="$(gh run list --workflow ci.yml --commit "$sha" \
            --limit 20 --json status,conclusion \
            --jq 'map(select(.status == "completed")) | .[0].conclusion // empty')"
          [ "$verdict" = "success" ] || { echo "ci.yml on $sha concluded: ${verdict:-no completed run}"; exit 1; }
          echo "ci.yml concluded success on $sha"

      - name: the tag and the version agree
        # Five places say the version -- the package, the build
        # configuration, the tag, the CHANGELOG and the sample report in
        # `docs/report-schema.md` -- and a release where they disagree is
        # one nobody can cite later. The fifth is pinned by
        # `tests/test_report_schema_doc.py` rather than here, so it dies
        # in `make check` above; this comment said four and the document
        # had five, which is how a launch checklist loses a line. It said
        # three before that, and the one it left out is the one that
        # decides what the artifact is *called*: the two drifted, and a
        # tag pushed in that state would have passed every check here,
        # built a wheel named for the older version, and offered it to an
        # index that already had one under that name. The suite pins the
        # two files against each other as well, so it fails where it is
        # cheap; this asks again because a release is where it is not.
        run: |
          pip install -e ".[dev]"
          v="$(python -c 'import aas_submodel_validate as m; print(m.__version__)')"
          built="$(python -c 'import re,pathlib; print(re.search(r"(?m)^version = \"([^\"]+)\"", pathlib.Path("pyproject.toml").read_text()).group(1))')"
          [ "$built" = "$v" ] || { echo "pyproject says $built and the package says $v"; exit 1; }
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
          heading="$(grep -m1 "^## $v — " CHANGELOG.md)" || { echo "CHANGELOG has no heading for $v"; exit 1; }
          case "$heading" in
            *unreleased*) echo "CHANGELOG still says: $heading"; exit 1 ;;
          esac
          echo "$heading" | grep -qE ' — [0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            || { echo "CHANGELOG heading carries no date: $heading"; exit 1; }

      - name: everything must be green first
        # The readers the battery extractors import are installed here
        # too, not only in CI. Without them that gate reports a skip and
        # passes -- so a release would have run a weaker check than every
        # push that led to it, which is the wrong way round.
        run: |
          pip install -e ".[battery]"
          make check

      - name: build the wheel and the sdist
        run: |
          pip install build
          python -m build

      - name: no distribution carries what it must not
        # Nothing this repository does not track, and not the
        # requirements indexes -- asked of what the archives contain.
        run: python tools/check_distributions.py

      - name: the dependency travels too, or the offline route is a lie
        # The release body offers `pip install --no-index --find-links .`
        # for a machine that has pip and no index. Run against the
        # release assets it failed -- "No matching distribution found for
        # aas-core3.0" -- because the one dependency was never attached.
        # The route only exists if the wheel it needs is on the page.
        run: |
          pip download --no-deps --only-binary=:all: --python-version 3.9 \
            "$(python -c 'import aas_submodel_validate, importlib.metadata as m; print(m.requires("aas-submodel-validate")[0])')" \
            -d dist/
          rm -rf offline && mkdir offline
          python -m venv offline/venv
          offline/venv/bin/pip install --no-index --find-links dist/ aas-submodel-validate
          offline/venv/bin/smtv --example > /dev/null
          echo "offline install: works from the release assets alone"
          rm -rf offline

      - name: build the single file twice; the hashes must match
        run: |
          python tools/build_zipapp.py -o dist/smtv.pyz --check
          python tools/build_zipapp.py -o /tmp/again.pyz
          cmp dist/smtv.pyz /tmp/again.pyz
          echo "reproducible: yes"

      - name: the package index will accept the description
        # CI runs this on every push and argues, correctly, that a
        # release line first exercised on release day dies on release
        # day. It is here as well because the two runs check different
        # bytes: CI checks a wheel it built, this checks the wheel that
        # is about to be signed, attached and uploaded. The ordering
        # below puts the GitHub Release and a public signature before
        # the upload, so a refusal there is a refusal with the release
        # already made -- and `twine check` is the one refusal that can
        # be moved in front of it for two seconds.
        #
        # Narrowed to this project's own artifacts: `dist/` also holds
        # the dependency wheel fetched for the offline route, whose
        # metadata is upstream's business and fails `--strict`.
        run: |
          pip install "twine>=6.1"
          twine check --strict dist/aas_submodel_validate-*

      - name: one checksum file beside them
        # `rm -f` first: the glob would otherwise take in a SHA256SUMS
        # left by an earlier run and list the file inside itself, which
        # is a checksum nobody can ever verify. A CI workspace is fresh
        # and a maintainer re-running this by hand is not.
        run: cd dist && rm -f SHA256SUMS && shasum -a 256 * > SHA256SUMS && cat SHA256SUMS

      - name: sign what was built
        # After this, `gh attestation verify smtv.pyz --repo <this>`
        # answers with the workflow, the repository and the commit that
        # produced these bytes -- the question a reviewer actually asks,
        # and the one a checksum file cannot answer. No key for anyone
        # to manage or lose.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          # Anchored to this project's own distribution name. Two of
          # the three carry a `*`, so the claim is not that these are
          # spelled out -- it is that `dist/*.whl` also matches the
          # dependency wheel downloaded for the offline route, which is
          # written into this same directory. Attesting that would be
          # this workflow claiming to have built somebody else's
          # artifact, the opposite of what a build attestation is for;
          # its provenance is upstream's to give. Asserted by applying
          # these patterns to the names the directory holds at this
          # point, because a rule about glob characters would fail on
          # this file and pass on `dist/aas_core3_0-*.whl`.
          subject-path: |
            dist/aas_submodel_validate-*.whl
            dist/aas_submodel_validate-*.tar.gz
            dist/smtv.pyz

      # The publisher below uploads exactly these bytes; nothing is rebuilt.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # The whole argument for the ordering above -- sign and upload
          # before the release exists, so a failure leaves the tag and
          # nothing published -- rests on being able to re-run this job.
          # The default is `false`, which means a run that uploaded and
          # then died at `gh release create` cannot be re-run: the second
          # attempt stops here with "an artifact with this name already
          # exists". Recoverable in theory, stuck in practice.
          overwrite: true

      - name: attach them to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # The body says three things the page did not, each of which cost
        # a reader real time: which of the five files to carry, that the
        # spelling is `python3`, and which Python it needs -- that last
        # one is a trip back out of the plant to find out, measured in
        # half-days rather than minutes.
        run: |
          cat > notes.md <<'NOTES'
          See CHANGELOG.md for what changed. **Requires Python 3.9 or newer.**

          **Which file to carry**

          - `smtv.pyz` — one file, for a machine with no package manager.
            Needs only a Python: `python3 smtv.pyz --example` gives a verdict
            with no file of your own, no repository and no network.
            On Windows that spelling is `py smtv.pyz --example` — the
            installer from python.org makes `py.exe` and `python.exe`,
            and `python3` there opens the Microsoft Store instead.
          - the two `.whl` files — for a machine that has pip but no index.
            Put both in a directory and run
            `python3 -m pip install --no-index --find-links . aas-submodel-validate`
            (`pip3` works too, where that is the spelling). The
            `aas_core3_0-…` wheel is the one dependency; without it that
            command has nothing to resolve. Under 400 KB together.
          - the `.tar.gz` — the source, for anyone building it themselves,
            and the only asset carrying `docs/`. Building it needs an
            index of its own (`setuptools`), so it is not the offline
            route — the two wheels above are. A finding's `per` line
            cites `docs/divergences.md` for the reading it answers for;
            that document is in here and in the repository, and not in
            the wheel or the single file. Carry it too if you may have
            to argue with a verdict offline.
          - `SHA256SUMS` — the checksums for everything above.

          **Was it corrupted on the way?** Run this where the files
          landed — that is the only place the question means anything:

              shasum -a 256 --ignore-missing -c SHA256SUMS

          `--ignore-missing` because you were probably told to carry one
          file, and without it `shasum` calls the ones you did not bring
          failures and exits 1. (`sha256sum -c` where that is the
          spelling.) Windows has neither; compare by eye against the
          line in `SHA256SUMS`:

              certutil -hashfile smtv.pyz SHA256

          The commands below are written for a Unix shell. In `cmd` the
          line continuation is `^` and in PowerShell it is a backtick;
          the simplest thing is to put each command on one line.

          **Who built it?** A checksum cannot answer that; the signature
          can. It needs GitHub, so do it on a machine that can reach it:

              gh attestation verify smtv.pyz --repo OWNER/REPO

          To check it on the far side instead, bring three things rather
          than one — the file, its bundle, and the trust root — because
          `gh` fetches that root over the network unless you hand it one:

              gh attestation download smtv.pyz --repo OWNER/REPO
              gh attestation trusted-root > trusted_root.jsonl
              # carry smtv.pyz, the .jsonl bundle and trusted_root.jsonl
              gh attestation verify smtv.pyz --repo OWNER/REPO \
                --bundle sha256:<digest>.jsonl \
                --custom-trusted-root trusted_root.jsonl

          The bundle is named for the digest. A colon is not a filename
          character on Windows, so `gh` writes `sha256-<digest>.jsonl`
          there -- use the name it actually wrote.

          The tool itself reaches no network, ever.
          NOTES
          python - <<'SUB'
          import os, pathlib
          notes = pathlib.Path("notes.md")
          notes.write_text(notes.read_text(encoding="utf-8").replace(
              "OWNER/REPO", os.environ["GITHUB_REPOSITORY"]), encoding="utf-8")
          SUB
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - name: only the wheel and the sdist go to PyPI
        run: mkdir up && cp dist/aas_submodel_validate-*.whl dist/aas_submodel_validate-*.tar.gz up/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: up
