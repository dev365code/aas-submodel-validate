# Runs when a version tag is pushed. Proves the tree green, builds the
# wheel, the sdist and the single file, proves the single file
# reproducible by building it twice, attaches everything to a GitHub
# Release with the checksums beside it -- for the air-gapped audience,
# "the hash on the release page is the hash of the file I carried in" is
# the entire trust story -- and then publishes the same bytes to PyPI.
#
# Until pypi.org trusts this repository for this project, the publish job
# fails visibly, on purpose, without touching the GitHub Release above.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signing. Without it the only trust story is a checksum file that
      # travels beside the files it vouches for and is replaceable by
      # whoever could replace them -- an integrity proof read as an
      # authenticity one. A site whose rule is "nothing unsigned comes
      # in" stops there, and `shasum -c` printing OK is exactly what
      # makes that stop look unnecessary to everyone else.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: the tag and the version agree
        # Four places say the version -- the package, the build
        # configuration, the tag and the CHANGELOG -- and a release where
        # they disagree is one nobody can cite later. This comment said
        # three and read three, and the one it left out is the one that
        # decides what the artifact is *called*: the two drifted, and a
        # tag pushed in that state would have passed every check here,
        # built a wheel named for the older version, and offered it to an
        # index that already had one under that name. The suite pins the
        # two files against each other as well, so it fails where it is
        # cheap; this asks again because a release is where it is not.
        run: |
          pip install -e ".[dev]"
          v="$(python -c 'import aas_submodel_validate as m; print(m.__version__)')"
          built="$(python -c 'import re,pathlib; print(re.search(r"(?m)^version = \"([^\"]+)\"", pathlib.Path("pyproject.toml").read_text()).group(1))')"
          [ "$built" = "$v" ] || { echo "pyproject says $built and the package says $v"; exit 1; }
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
          heading="$(grep -m1 "^## $v — " CHANGELOG.md)" || { echo "CHANGELOG has no heading for $v"; exit 1; }
          case "$heading" in
            *unreleased*) echo "CHANGELOG still says: $heading"; exit 1 ;;
          esac
          echo "$heading" | grep -qE ' — [0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            || { echo "CHANGELOG heading carries no date: $heading"; exit 1; }

      - name: everything must be green first
        # The readers the battery extractors import are installed here
        # too, not only in CI. Without them that gate reports a skip and
        # passes -- so a release would have run a weaker check than every
        # push that led to it, which is the wrong way round.
        run: |
          pip install openpyxl pymupdf
          make check

      - name: build the wheel and the sdist
        run: |
          pip install build
          python -m build

      - name: no distribution carries what it must not
        # Nothing this repository does not track, and not the
        # requirements indexes -- asked of what the archives contain.
        run: python tools/check_distributions.py

      - name: the dependency travels too, or the offline route is a lie
        # The release body offers `pip install --no-index --find-links .`
        # for a machine that has pip and no index. Run against the
        # release assets it failed -- "No matching distribution found for
        # aas-core3.0" -- because the one dependency was never attached.
        # The route only exists if the wheel it needs is on the page.
        run: |
          pip download --no-deps --only-binary=:all: --python-version 3.9 \
            "$(python -c 'import aas_submodel_validate, importlib.metadata as m; print(m.requires("aas-submodel-validate")[0])')" \
            -d dist/
          rm -rf offline && mkdir offline
          python -m venv offline/venv
          offline/venv/bin/pip install --no-index --find-links dist/ aas-submodel-validate
          offline/venv/bin/smtv --example > /dev/null
          echo "offline install: works from the release assets alone"
          rm -rf offline

      - name: build the single file twice; the hashes must match
        run: |
          python tools/build_zipapp.py -o dist/smtv.pyz --check
          python tools/build_zipapp.py -o /tmp/again.pyz
          cmp dist/smtv.pyz /tmp/again.pyz
          echo "reproducible: yes"

      - name: one checksum file beside them
        run: cd dist && shasum -a 256 * > SHA256SUMS && cat SHA256SUMS

      - name: sign what was built
        # After this, `gh attestation verify smtv.pyz --repo <this>`
        # answers with the workflow, the repository and the commit that
        # produced these bytes -- the question a reviewer actually asks,
        # and the one a checksum file cannot answer. No key for anyone
        # to manage or lose.
        uses: actions/attest-build-provenance@v2
        with:
          # Named, not globbed. `dist/*.whl` now also matches the
          # dependency wheel downloaded for the offline route, and
          # attesting that would be this workflow claiming to have built
          # somebody else's artifact -- the opposite of what a build
          # attestation is for. Its provenance is upstream's to give.
          subject-path: |
            dist/aas_submodel_validate-*.whl
            dist/aas_submodel_validate-*.tar.gz
            dist/smtv.pyz

      # The publisher below uploads exactly these bytes; nothing is rebuilt.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: attach them to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # The body says three things the page did not, each of which cost
        # a reader real time: which of the five files to carry, that the
        # spelling is `python3`, and which Python it needs -- that last
        # one is a trip back out of the plant to find out, measured in
        # half-days rather than minutes.
        run: |
          cat > notes.md <<'NOTES'
          See CHANGELOG.md for what changed. **Requires Python 3.9 or newer.**

          **Which file to carry**

          - `smtv.pyz` — one file, for a machine with no package manager.
            Needs only a Python: `python3 smtv.pyz --example` gives a verdict
            with no file of your own, no repository and no network.
          - the two `.whl` files — for a machine that has pip but no index.
            Put both in a directory and run
            `python3 -m pip install --no-index --find-links . aas-submodel-validate`
            (`pip3` works too, where that is the spelling). The
            `aas_core3.0` wheel is the one dependency; without it that
            command has nothing to resolve. Under 400 KB together.
          - the `.tar.gz` — the source, for anyone building it themselves.
          - `SHA256SUMS` — the checksums for everything above.

          **Checking what you carried**

              shasum -a 256 --ignore-missing -c SHA256SUMS
              gh attestation verify smtv.pyz --repo OWNER/REPO

          `--ignore-missing` because you were told to carry one file, and
          without it `shasum` reports the three you did not bring as
          failures and exits 1. The first says nothing was corrupted on
          the way. The second says
          which workflow in which repository built these bytes — the one that
          matters if you are signing for what comes through the door.

          It reaches no network, and neither does the tool.
          NOTES
          sed -i "s|OWNER/REPO|$GITHUB_REPOSITORY|" notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: only the wheel and the sdist go to PyPI
        run: mkdir up && cp dist/aas_submodel_validate-*.whl dist/aas_submodel_validate-*.tar.gz up/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: up
