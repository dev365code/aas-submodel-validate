name: upstream

# Whether the IDTA templates this project vendors have moved upstream.
#
# tools/vendor_template.py names the one commit of
# admin-shell-io/submodel-templates every vendored file is taken from, and
# that pin does not move on its own. This asks upstream every Monday -- on
# the default branch, the only one GitHub runs a schedule on, and only while
# the repository is active, since GitHub turns a public repository's schedules
# off after 60 days without activity -- and on a push that changes the pin or
# the check, whether any folder those files
# come from is a different tree now -- a new edition, an edited file, a
# folder gone. A red run here is not a defect in this project: exit 1 lists
# what moved and is a decision to make about the pin, and exit 2 is a
# question upstream did not answer.

on:
  workflow_dispatch:
  # Schedules run only on the default branch; GitHub disables them in a
  # public repository after 60 days without activity.
  schedule:
    - cron: "17 6 * * 1"          # 06:17 UTC every Monday
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/upstream.yml"
      - "tools/upstream_moved.py"
      - "tools/vendor_template.py"

permissions:
  contents: read

jobs:
  moved:
    name: the vendored templates have not moved upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python tools/upstream_moved.py
        env:
          GH_TOKEN: ${{ github.token }}
